<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriConnect</title>
    <style>
      .ac-weather-wrap{max-width:620px;margin:0 auto;
      border-radius:20px;overflow:hidden;
      box-shadow:0 8px 32px rgba(0,0,0,0.15)}
      .ac-weather-main{background:linear-gradient(
      135deg,#1a6b3c,#2d9e5e);padding:28px 24px 20px;
      color:white;position:relative}
      .ac-weather-row1{display:flex;
      justify-content:space-between;align-items:flex-start}
      .ac-city{font-size:18px;font-weight:700}
      .ac-date{font-size:12px;opacity:0.8;margin-top:4px}
      .ac-icon-temp{text-align:right}
      .ac-main-icon{font-size:56px;line-height:1}
      .ac-main-temp{font-size:52px;font-weight:700}
      .ac-condition{font-size:14px;opacity:0.85;margin-top:4px}
      .ac-details-strip{display:flex;
      justify-content:space-around;
      background:rgba(255,255,255,0.12);
      padding:12px;border-radius:12px;margin-top:16px}
      .ac-det{text-align:center;font-size:12px}
      .ac-det .lbl{opacity:0.75;margin-bottom:3px}
      .ac-det .val{font-size:16px;font-weight:700}
      .ac-advisory-bar{padding:12px 16px;font-size:13px;
      font-weight:600;display:flex;align-items:center;gap:8px}
      .ac-advisory-bar.hot{background:#e64a19;color:white}
      .ac-advisory-bar.rain{background:#1565c0;color:white}
      .ac-advisory-bar.cold{background:#0288d1;color:white}
      .ac-advisory-bar.storm{background:#1a237e;color:white}
      .ac-advisory-bar.normal{background:#2e7d32;color:white}
      .ac-forecast-wrap{background:white;padding:16px}
      .ac-forecast-title{font-size:13px;font-weight:700;
      color:#555;margin-bottom:12px;text-transform:uppercase}
      .ac-forecast-row{display:flex;justify-content:space-between;gap:6px}
      .ac-fc-day{flex:1;text-align:center;padding:10px 4px;
      border-radius:10px;background:#f5f9f5}
      .ac-fc-day.today{background:#e8f5e9;
      border:2px solid #2d6a2d}
      .ac-fc-name{font-size:10px;font-weight:700;
      color:#666;margin-bottom:4px}
      .ac-fc-icon{font-size:20px;margin:4px 0}
      .ac-fc-hi{font-size:12px;font-weight:700;color:#222}
      .ac-fc-lo{font-size:11px;color:#888}
      .ac-fc-rain{font-size:10px;color:#1976d2;margin-top:2px}
      .ac-loc-section{background:#f9f9f9;
      border-top:1px solid #eee;
      padding:12px 16px;display:flex;
      align-items:center;gap:10px}
      .ac-loc-btn{flex:1;background:#2d6a2d;color:white;
      border:none;padding:10px 16px;border-radius:8px;
      font-size:13px;font-weight:600;cursor:pointer}
      .ac-loc-btn:disabled{background:#aaa;cursor:not-allowed}
      .ac-loc-info{font-size:11px;color:#888;flex:1}
      .ac-loading{text-align:center;padding:60px 20px;
      background:linear-gradient(135deg,#1a6b3c,#2d9e5e);
      color:white;border-radius:20px}
      .ac-spinner{width:36px;height:36px;
      border:3px solid rgba(255,255,255,0.3);
      border-top-color:white;border-radius:50%;
      animation:wxspin 0.8s linear infinite;
      margin:0 auto 12px}
      @keyframes wxspin{to{transform:rotate(360deg)}}
      @media(max-width:480px){
      .ac-main-temp{font-size:40px}
      .ac-main-icon{font-size:42px}
      .ac-forecast-row{gap:3px}
      .ac-fc-day{padding:8px 2px}
      .ac-fc-icon{font-size:16px}
      .ac-fc-name{font-size:9px}}

      /* ================================
         SCROLL ANIMATIONS - HOME PAGE
      ================================ */

      /* Base hidden state */
      .ac-animate {
        opacity: 0;
        transition: all 0.8s ease;
      }

      /* Slide up animation */
      .ac-slide-up {
        opacity: 0;
        transform: translateY(60px);
        transition: all 0.8s ease;
      }

      /* Slide left animation */
      .ac-slide-left {
        opacity: 0;
        transform: translateX(-60px);
        transition: all 0.8s ease;
      }

      /* Slide right animation */
      .ac-slide-right {
        opacity: 0;
        transform: translateX(60px);
        transition: all 0.8s ease;
      }

      /* Zoom in animation */
      .ac-zoom-in {
        opacity: 0;
        transform: scale(0.85);
        transition: all 0.8s ease;
      }

      /* Fade in animation */
      .ac-fade-in {
        opacity: 0;
        transition: all 1s ease;
      }

      /* When element becomes visible */
      .ac-slide-up.ac-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .ac-slide-left.ac-visible {
        opacity: 1;
        transform: translateX(0);
      }

      .ac-slide-right.ac-visible {
        opacity: 1;
        transform: translateX(0);
      }

      .ac-zoom-in.ac-visible {
        opacity: 1;
        transform: scale(1);
      }

      .ac-fade-in.ac-visible {
        opacity: 1;
      }

      /* Delay classes for stagger effect */
      .ac-delay-1 { transition-delay: 0.1s; }
      .ac-delay-2 { transition-delay: 0.2s; }
      .ac-delay-3 { transition-delay: 0.3s; }
      .ac-delay-4 { transition-delay: 0.4s; }
      .ac-delay-5 { transition-delay: 0.5s; }
      .ac-delay-6 { transition-delay: 0.6s; }

      /* ================================
         LEAF EATING LOADING ANIMATION
         Only for weather section
      ================================ */

      .ac-leaf-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        background: transparent;
        min-height: 150px;
      }

      .ac-leaf-wrap {
        position: relative;
        width: 140px;
        height: 30px;
      }

      /* Single straight green leaf */
      .ac-leaf {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 130px;
        height: 18px;
        background: #4caf50;
        border-radius: 50%;
        overflow: hidden;
      }

      /* Leaf center vein line */
      .ac-leaf::after {
        content: '';
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 100px;
        height: 1.5px;
        background: #2d6a2d;
        opacity: 0.4;
      }

      /* Eaten part - 
         covers leaf from right to left */
      .ac-eaten {
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: 0%;
        background: transparent;
        animation: eating 1.8s 
          linear infinite;
      }

      /* Insect emoji moving left */
      .ac-bug {
        position: absolute;
        right: -20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        animation: bugEat 1.8s 
          linear infinite;
        line-height: 1;
      }

      /* Leaf disappears as bug eats */
      @keyframes eating {
        0% {
          width: 0%;
          background: transparent;
        }
        100% {
          width: 100%;
          background: transparent;
        }
      }

      /* Bug moves from right to left */
      @keyframes bugEat {
        0% {
          right: -20px;
        }
        100% {
          right: 125px;
        }
      }

      /* Leaf shrinks as bug eats it */
      .ac-leaf {
        animation: leafShrink 1.8s 
          linear infinite;
        transform-origin: left center;
      }

      @keyframes leafShrink {
        0% {
          width: 130px;
          opacity: 1;
        }
        95% {
          width: 0px;
          opacity: 1;
        }
        96%,100% {
          width: 130px;
          opacity: 1;
        }
      }
    </style>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    // AgriConnect Weather v3
    // Manual city search system

    var WXv3 = {
      WK: 'ac_wx_v3',
      CK: 'ac_city_v3',
      LK: 'agriconnect-lang',
      defaultCity: 'Lahore'
    };

    function wShowLeafLoader(lang) {
      return (
        '<div class="ac-leaf-loader">'+
        '<div class="ac-leaf-wrap">'+
        '<div class="ac-leaf"></div>'+
        '<div class="ac-bug">🐛</div>'+
        '</div>'+
        '</div>'
      );
    }

    // Pakistan popular cities
    var PK_CITIES = [
      'Lahore','Islamabad','Karachi',
      'Multan','Faisalabad','Gujrat',
      'Rawalpindi','Peshawar','Quetta',
      'Sialkot','Gujranwala','Sahiwal',
      'Bahawalpur','Sargodha','Hyderabad'
    ];

    // Weather code to info
    function wInfo(code){
      if(code===0) return {icon:'☀️',ru:'Saaf Aasman',en:'Clear Sky'};
      if(code<=3)  return {icon:'⛅',ru:'Aasmaani Badal',en:'Partly Cloudy'};
      if(code<=48) return {icon:'🌫️',ru:'Dhund',en:'Foggy'};
      if(code<=55) return {icon:'🌦️',ru:'Halki Baarish',en:'Light Rain'};
      if(code<=65) return {icon:'🌧️',ru:'Baarish',en:'Rainy'};
      if(code<=77) return {icon:'❄️',ru:'Barf',en:'Snow'};
      if(code<=82) return {icon:'🌧️',ru:'Tez Baarish',en:'Heavy Rain'};
      return       {icon:'⛈️',ru:'Shadeed Toofan',en:'Thunderstorm'};
    }

    // Farming advice
    function wAdvice(temp,rain,code){
      if(temp>35) return {type:'hot',icon:'🌡️',
        ru:'Garmi Bohot Zyada! Subah Ya Sham Ko Pani Dein.',
        en:'Extreme Heat! Water crops morning or evening.'};
      if(rain>70) return {type:'rain',icon:'🌧️',
        ru:'Baarish Ka Zyada Imkan! Katai Rok Lein.',
        en:'High Rain Chance! Stop harvesting.'};
      if(temp<8)  return {type:'cold',icon:'🥶',
        ru:'Shadeed Sardi! Raat Ko Fasal Dhakein.',
        en:'Severe Cold! Cover crops at night.'};
      if(code>=95)return {type:'storm',icon:'⛈️',
        ru:'Toofan Ka Khatra! Khet Mein Mat Jayein.',
        en:'Storm Warning! Stay away from fields.'};
      return      {type:'normal',icon:'🌿',
        ru:'Mausam Khushgawar! Fasal Lagane Ka Acha Waqt.',
        en:'Pleasant Weather! Great time to plant crops.'};
    }

    // Day names
    function wGetDayName(dateString, index, lang) {
      var DAYS_RU = ['Itwar', 'Somar', 'Mangal', 'Budh', 'Jumerat', 'Jumma', 'Hafta'];
      var DAYS_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      if(index === 0) return lang === 'en' ? 'Today' : 'Aaj';
      if(index === 1) return lang === 'en' ? 'Tomorrow' : 'Kal';
      var date = new Date(dateString);
      var dayNumber = date.getDay();
      return lang === 'en' ? DAYS_EN[dayNumber] : DAYS_RU[dayNumber];
    }

    function wGetDateStr(lang){
      var d = new Date();
      var DAYS_RU = ['Itwar','Somar','Mangal','Budh','Jumerat','Jumma','Hafta'];
      var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      if(lang === 'en'){
        var DAYS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        return DAYS_EN[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
      } else {
        return DAYS_RU[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
      }
    }

    // Step 1: City name to coordinates
    async function wGetCoords(cityName){
      try{
        var url='https://geocoding-api.open-meteo.com/v1/search'+
          '?name='+encodeURIComponent(cityName)+
          '&count=1&language=en&format=json';
        var r=await fetch(url);
        var d=await r.json();
        if(d.results && d.results.length>0){
          return{
            lat: d.results[0].latitude,
            lng: d.results[0].longitude,
            city: d.results[0].name+', '+
              (d.results[0].admin1||'Pakistan')
          };
        }
        return null;
      }catch(e){return null;}
    }

    // Step 2: Coordinates to weather
    async function wGetWeather(lat,lng,city){
      try{
        var url='https://api.open-meteo.com/v1/forecast'+
          '?latitude='+lat+
          '&longitude='+lng+
          '&current=temperature_2m,relative_humidity_2m,'+
          'wind_speed_10m,precipitation_probability,weather_code'+
          '&daily=temperature_2m_max,temperature_2m_min,'+
          'precipitation_probability_max,weather_code'+
          '&timezone=Asia%2FKarachi&forecast_days=7';
        var r=await fetch(url);
        var d=await r.json();
        var result={
          city:city,lat:lat,lng:lng,
          at:Date.now(),
          cur:{
            temp:Math.round(d.current.temperature_2m),
            humidity:d.current.relative_humidity_2m,
            wind:Math.round(d.current.wind_speed_10m),
            rain:d.current.precipitation_probability||0,
            code:d.current.weather_code
          },
          daily:{
            time:d.daily.time,
            hi:d.daily.temperature_2m_max,
            lo:d.daily.temperature_2m_min,
            rain:d.daily.precipitation_probability_max,
            code:d.daily.weather_code
          }
        };
        // Save to localStorage
        localStorage.setItem(WXv3.WK,JSON.stringify(result));
        localStorage.setItem(WXv3.CK,city);
        return result;
      }catch(e){
        // Return cached if available
        var c=localStorage.getItem(WXv3.WK);
        if(c) return JSON.parse(c);
        // Return default
        return{
          city:city,at:Date.now(),
          cur:{temp:28,humidity:62,wind:11,rain:15,code:0},
          daily:null
        };
      }
    }

    // Search city and update weather
    async function wSearchCity(cityName){
      if(!cityName || cityName.trim()==='') return;

      var lang = localStorage.getItem(WXv3.LK) || 'ru';

      var hw = document.getElementById('ac-home-weather');
      var fw = document.getElementById('ac-full-weather');

      // Show leaf loader
      if(hw) hw.innerHTML = wShowLeafLoader(lang);
      if(fw) {
        var fwContent = document.getElementById('ac-full-weather');
        if(fwContent) {
          // Keep search bar visible
          // Only replace weather card area
          var weatherCard = fwContent.querySelector('.ac-weather-wrap');
          if(weatherCard) {
            weatherCard.outerHTML = wShowLeafLoader(lang);
          } else {
            fwContent.innerHTML = wShowLeafLoader(lang);
          }
        }
      }

      // Get coordinates first
      var coords=await wGetCoords(cityName);

      if(!coords){
        // City not found error
        var errHTML='<div style="background:#fff3e0;'+
          'border-left:4px solid #ff9800;'+
          'padding:16px;border-radius:8px;'+
          'color:#e65100;font-size:14px;">'+
          '❌ '+(l?
          'City not found. Try another name.':
          'Shehar nahi mila. Doosra naam likhein.')+
          '</div>';
        if(hw) hw.innerHTML=errHTML;
        return;
      }

      // Get weather
      var data=await wGetWeather(coords.lat,coords.lng,coords.city);

      // Update both widgets
      wUpdateAll(data,lang);
    }

    // Build home widget HTML
    function wBuildHome(data,lang){
      var l=lang==='en';
      var wi=wInfo(data.cur.code);
      var ad=wAdvice(data.cur.temp,data.cur.rain,data.cur.code);
      var dateStr=wGetDateStr(lang);

      var labels = {
        hum: l ? 'Humidity' : 'Nami',
        wind: l ? 'Wind Speed' : 'Hawa Ki Raftar',
        rain: l ? 'Rain Chance' : 'Baarish Ka Imkan'
      };

      return '<div class="ac-weather-wrap">'+
        '<div class="ac-weather-main">'+
        '<div class="ac-weather-row1">'+
        '<div>'+
        '<div class="ac-city">📍 '+data.city+'</div>'+
        '<div class="ac-date">'+dateStr+'</div>'+
        '</div>'+
        '<div class="ac-icon-temp">'+
        '<div class="ac-main-icon">'+wi.icon+'</div>'+
        '<div class="ac-main-temp">'+data.cur.temp+'°C</div>'+
        '</div></div>'+
        '<div class="ac-condition">'+(l?wi.en:wi.ru)+'</div>'+
        '<div class="ac-details-strip">'+
        '<div class="ac-det">'+
        '<div class="lbl">💧 '+labels.hum+'</div>'+
        '<div class="val">'+data.cur.humidity+'%</div></div>'+
        '<div class="ac-det">'+
        '<div class="lbl">💨 '+labels.wind+'</div>'+
        '<div class="val">'+data.cur.wind+' km/h</div></div>'+
        '<div class="ac-det">'+
        '<div class="lbl">🌧️ '+labels.rain+'</div>'+
        '<div class="val">'+data.cur.rain+'%</div></div>'+
        '</div></div>'+
        '<div class="ac-advisory-bar '+ad.type+'">'+
        ad.icon+' '+(l?ad.en:ad.ru)+
        '</div></div>';
    }

    // Build forecast days
    function wBuildDays(data,lang){
      if(!data.daily||!data.daily.time) return '';
      return data.daily.time.map(function(dt,i){
        var wi=wInfo(data.daily.code[i]);
        return '<div class="ac-fc-day'+(i===0?' today':'')+'">'+
          '<div class="ac-fc-name">'+wGetDayName(dt,i,lang)+'</div>'+
          '<div class="ac-fc-icon">'+wi.icon+'</div>'+
          '<div class="ac-fc-hi">'+
            Math.round(data.daily.hi[i])+'°</div>'+
          '<div class="ac-fc-lo">'+
            Math.round(data.daily.lo[i])+'°</div>'+
          '<div class="ac-fc-rain">'+
            '🌧️'+data.daily.rain[i]+'%</div>'+
          '</div>';
      }).join('');
    }

    // Build full weather tab HTML
    function wBuildFull(data,lang){
      var l=lang==='en';
      var wi=wInfo(data.cur.code);
      var ad=wAdvice(data.cur.temp,data.cur.rain,data.cur.code);
      var dateStr=wGetDateStr(lang);

      var labels = {
        placeholder: l ? 'Enter city name... e.g. Lahore, Karachi, Islamabad' : 'Shehar ka naam likhein... jaise Lahore, Karachi, Islamabad',
        quick: l ? 'Quick Select:' : 'Jaldi Chunein:',
        hum: l ? 'Humidity' : 'Nami',
        wind: l ? 'Wind Speed' : 'Hawa Ki Raftar',
        rain: l ? 'Rain Chance' : 'Baarish Ka Imkan',
        forecast: l ? '7 Day Forecast' : '7 Din Ka Mosam'
      };

      // Quick city buttons
      var cityBtns=PK_CITIES.map(function(c){
        return '<button onclick="wQuickCity(\''+c+'\')"'+
          ' style="background:#f0f9f0;border:1px solid #2d6a2d;'+
          'color:#2d6a2d;padding:4px 10px;border-radius:20px;'+
          'font-size:12px;cursor:pointer;margin:3px;">'+
          c+'</button>';
      }).join('');

      return (
        // Search bar section
        '<div style="background:#f9f9f9;'+
        'border-radius:12px;padding:16px;margin-bottom:16px;">'+

        '<div style="display:flex;gap:8px;margin-bottom:10px;">'+
        '<input id="wx-city-input" type="text"'+
        ' placeholder="'+labels.placeholder+'"'+
        ' onkeypress="if(event.key===\'Enter\'){wSearchCity(this.value);}"'+
        ' onkeydown="if(event.keyCode===13){wSearchCity(this.value);}"'+
        ' style="flex:1;padding:10px 14px;border:2px solid #2d6a2d;'+
        'border-radius:8px;font-size:14px;outline:none;"/>'+
        '<button onclick="wSearchCity('+
          'document.getElementById(\'wx-city-input\').value)"'+
        ' style="background:#2d6a2d;color:white;border:none;'+
        'padding:10px 18px;border-radius:8px;'+
        'font-size:16px;cursor:pointer;">🔍</button>'+
        '</div>'+

        // Quick city buttons
        '<div style="font-size:11px;color:#888;margin-bottom:6px;">'+
        labels.quick+
        '</div>'+
        '<div>'+cityBtns+'</div>'+
        '</div>'+

        // Weather card
        '<div class="ac-weather-wrap">'+
        '<div class="ac-weather-main">'+
        '<div class="ac-weather-row1">'+
        '<div>'+
        '<div class="ac-city">📍 '+data.city+'</div>'+
        '<div class="ac-date">'+dateStr+'</div>'+
        '</div>'+
        '<div class="ac-icon-temp">'+
        '<div class="ac-main-icon">'+wi.icon+'</div>'+
        '<div class="ac-main-temp">'+data.cur.temp+'°C</div>'+
        '</div></div>'+

    <script>
    // Scroll Animation Engine
    function acInitAnimations() {
      // Create Intersection Observer
      var observer = new IntersectionObserver(
        function(entries) {
          entries.forEach(function(entry) {
            if(entry.isIntersecting) {
              // Scrolling down - animate in
              entry.target.classList.add(
                'ac-visible'
              );
            } else {
              // Scrolling up - animate out
              entry.target.classList.remove(
                'ac-visible'
              );
            }
          });
        },
        {
          threshold: 0.15,
          rootMargin: '0px 0px -50px 0px'
        }
      );
      
      // Observe all animated elements
      document.querySelectorAll(
        '.ac-slide-up, .ac-slide-left, ' +
        '.ac-slide-right, .ac-zoom-in, ' +
        '.ac-fade-in'
      ).forEach(function(el) {
        observer.observe(el);
      });
    }

    window.acInitAnimations = acInitAnimations;
    window.addEventListener('load', acInitAnimations);
    </script>

    async function acSaveProfile() {
      var user = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : null;
      if(!user) {
        var userDataStr = localStorage.getItem('ac_user');
        if (userDataStr) {
          try {
            var parsed = JSON.parse(userDataStr);
            if (parsed && parsed.uid) {
              user = { uid: parsed.uid, email: parsed.email || '', displayName: parsed.fullName || '' };
            }
          } catch(e) {}
        }
      }
      if(!user) return;
      
      var lang = localStorage.getItem(
        'agriconnect-lang'
      ) || 'ru';
      var l = lang === 'en';
      
      var btn = document.getElementById(
        'save-profile-btn'
      );
      if(btn) {
        btn.disabled = true;
        btn.textContent = 
          l?'Saving...':'Save ho raha hai...';
      }
      
      var updatedData = {
        fullName: document.getElementById(
          'edit-fullname'
        ).value.trim(),
        phone: document.getElementById(
          'edit-phone'
        ).value.trim(),
        whatsapp: document.getElementById(
          'edit-whatsapp'
        ).value.trim(),
        city: document.getElementById(
          'edit-city'
        ).value.trim(),
        area: document.getElementById(
          'edit-area'
        ).value.trim(),
        address: document.getElementById(
          'edit-address'
        ).value.trim(),
        landmark: document.getElementById(
          'edit-landmark'
        ).value.trim(),
        updatedAt: firebase.firestore
          .FieldValue.serverTimestamp()
      };
      
      try {
        // Save to Firebase
        await firebase.firestore()
          .collection('users')
          .doc(user.uid)
          .set(updatedData, { merge: true });
        
        // Update Firebase auth display name
        if (user.updateProfile && updatedData.fullName) {
          try {
            await user.updateProfile({
              displayName: updatedData.fullName
            });
          } catch(e) {}
        }
        
        // Update localStorage
        var existing = JSON.parse(
          localStorage.getItem('ac_user') || '{}'
        );
        var merged = Object.assign(
          existing, updatedData
        );
        localStorage.setItem(
          'ac_user', JSON.stringify(merged)
        );
        
        window.dispatchEvent(new Event('ac_user_updated'));
        
        // Show success
        if(btn) {
          btn.disabled = false;
          btn.textContent = l?
            '✅ Saved!':'✅ Save Ho Gaya!';
          btn.style.background = '#27ae60';
        }
        
        // Go back to profile view after 1.5s
        setTimeout(function() {
          acShowProfile();
        }, 1500);
        
      } catch(error) {
        if(btn) {
          btn.disabled = false;
          btn.textContent = l?
            'Save Changes':
            'Changes Save Karein';
        }
        alert(l?
          'Could not save. Try again!':
